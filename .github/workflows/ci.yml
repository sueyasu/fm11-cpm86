name: CBIOS and disk image checks
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        run: sudo apt-get update -qq && sudo apt-get install -y nasm
      - name: Verify CBIOS and 2HD image layout
        run: |
          make build/cbios.bin
          make test
          make build/cbios_selftest_resident.bin
      - name: Verify symmetric floppy image targets
        run: |
          make -j2 boot-2d boot-2hd CPM86_CORE=build/test_2hd_core.bin
          rm build/fm11_cpm86_2d.raw build/fm11_cpm86_2hd.raw
          make -j2 boot-2d boot-2hd CPM86_CORE=build/test_2hd_core.bin
          rm build/fm11_cpm86_2d.d88 build/fm11_cpm86_2hd.d88
          make -j2 boot-2d boot-2hd CPM86_CORE=build/test_2hd_core.bin
